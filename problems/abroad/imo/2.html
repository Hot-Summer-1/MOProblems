<p>设<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>n</mi></mrow></math>是正整数. 刘邦和项羽有一根长度为<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mn>1</mn></mrow></math>的细棍, 他们按下述方式进行分配. 刘邦先在细棍上标记不超过<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>n</mi></mrow></math>个点, 接着项羽再标记不超过<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>n</mi></mrow></math>个点. 标记的点是互不相同的. 随后在所有标记点处将细棍切开, 这样细棍被分成了若干个小段. 在此之后, 他们轮流选取一个未被选取的小段, 由刘邦先选, 直至全部选完. 每个人的目标均是使得自己选取的小段的总长度尽可能大. 对每个<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>n</mi></mrow></math>, 求最大的<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>c</mi></mrow></math>, 使得无论项羽如何操作, 刘邦总能确保自己选取的小段的总长度不小于<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>c</mi></mrow></math>.</p>
