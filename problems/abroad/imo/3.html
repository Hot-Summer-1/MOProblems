<p>单于和木兰玩一个游戏. 取定一个双方都知道的角度<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003B8;</mi></mrow></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msup><mn>0</mn><mrow><mo>&#x02218;</mo></mrow></msup><mo>&#x0003C;</mo><mi>&#x003B8;</mi><mo>&#x0003C;</mo><msup><mn>180</mn><mrow><mo>&#x02218;</mo></mrow></msup></mrow></math>. 游戏开始时, 单于在纸上剪出一个三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4AF;</mi></mrow></math>, 内角大小由其任选. 接着他们反复进行下面的步骤:</p>
<ul>
<li>若三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4AF;</mi></mrow></math>至少有一个内角的大小等于<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003B8;</mi></mrow></math>, 则游戏结束, 木兰获胜. </li>
<li>否则, 木兰在<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4AF;</mi></mrow></math>的边界上选取一个点<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>P</mi></mrow></math>(不是<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4AF;</mi></mrow></math>的顶点), 再沿点<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>P</mi></mrow></math>与<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4AF;</mi></mrow></math>上相对顶点的连线剪开, 将三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4AF;</mi></mrow></math>分成两个三角形.</li>
<li>单于丢弃其中一个三角形, 留下的三角形作为新的<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x1D4AF;</mi></mrow></math>.</li>
</ul>
<p>对哪些实数值<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>&#x003B8;</mi></mrow></math>, 木兰可以确保在有限步后获胜, 不论单于如何进行游戏?</p>
