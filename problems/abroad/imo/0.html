<p>黑板上写有<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mn>2026</mn></mrow></math>个大于<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mn>1</mn></mrow></math>的整数, 允许有相同的数. 在一次操作中, 孔夫子选取黑板上两个不同位置的整数<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>m</mi><mo>&#x0003E;</mo><mn>1</mn></mrow></math>和<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>n</mi><mo>&#x0003E;</mo><mn>1</mn></mrow></math>， 并将这两个整数替换成
<math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mrow><mo movablelimits="true">gcd</mo><mo stretchy="false">&#x00028;</mo><mi>m</mi><mo>&#x0002C;</mo><mi>n</mi><mo stretchy="false">&#x00029;</mo><mtext>和</mtext><mfrac><mrow><mo>lcm</mo><mo stretchy="false">&#x00028;</mo><mi>m</mi><mo>&#x0002C;</mo><mi>n</mi><mo stretchy="false">&#x00029;</mo></mrow><mrow><mo movablelimits="true">gcd</mo><mo stretchy="false">&#x00028;</mo><mi>m</mi><mo>&#x0002C;</mo><mi>n</mi><mo stretchy="false">&#x00029;</mo></mrow></mfrac><mtext>.</mtext></mrow></math>
只要能够进行这样的操作他便继续操作.
(1) 求证: 不论孔夫子如何选择, 在有限次操作后, 黑板上恰有一个大于<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mn>1</mn></mrow></math>的整数, 记此数为<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>M</mi></mrow></math>.
(2) 求证: 整数<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>M</mi></mrow></math>的值不依赖于孔夫子的选择.</p>
