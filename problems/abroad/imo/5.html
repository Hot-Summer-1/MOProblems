<p>设无穷序列<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msub><mi>a</mi><mrow><mn>1</mn></mrow></msub><mo>&#x0002C;</mo><msub><mi>a</mi><mrow><mn>2</mn></mrow></msub><mo>&#x0002C;</mo><msub><mi>a</mi><mrow><mn>3</mn></mrow></msub><mo>&#x0002C;</mo><mo>&#x022EF;</mo></mrow></math>的每一项均是大于<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mn>1</mn></mrow></math>的整数. 已知对每个正整数<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>n</mi></mrow></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub></mrow></math>是大于<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msub><mi>a</mi><mi>n</mi></msub></mrow></math>的所有正整数中, 满足<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo movablelimits="true">gcd</mo><mo stretchy="false">&#x00028;</mo><msub><mi>a</mi><mrow><mi>n</mi><mo>&#x0002B;</mo><mn>1</mn></mrow></msub><mo>&#x0002C;</mo><msub><mi>a</mi><mi>i</mi></msub><mo stretchy="false">&#x00029;</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math>对每个<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>i</mi><mo>&#x0003D;</mo><mn>1</mn><mo>&#x0002C;</mo><mn>2</mn><mo>&#x0002C;</mo><mo>&#x022EF;</mo><mo>&#x0002C;</mo><mi>n</mi></mrow></math>均成立的最小正整数. 求证: 存在正整数<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>T</mi></mrow></math>和<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>L</mi></mrow></math>, 使得对任意正整数<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>n</mi></mrow></math>, 均有<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>&#x0002B;</mo><mi>T</mi></mrow></msub><mo>&#x0003D;</mo><msub><mi>a</mi><mi>n</mi></msub><mo>&#x0002B;</mo><mi>L</mi></mrow></math>.</p>
