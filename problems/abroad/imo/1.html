<p>在三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>A</mi><mi>B</mi><mi>C</mi></mrow></math>中, 点<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>M</mi></mrow></math>和<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>N</mi></mrow></math>分别是边<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>A</mi><mi>B</mi></mrow></math>和<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>A</mi><mi>C</mi></mrow></math>的中点. 在三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>B</mi><mi>M</mi><mi>C</mi></mrow></math>和三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>B</mi><mi>N</mi><mi>C</mi></mrow></math>的内部分别选取点<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>K</mi></mrow></math>和<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>L</mi></mrow></math>, 使得点<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>K</mi></mrow></math>在三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>A</mi><mi>B</mi><mi>L</mi></mrow></math>的内部, 点<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>L</mi></mrow></math>在三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>A</mi><mi>K</mi><mi>C</mi></mrow></math>的内部, 已知<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02220;</mo><mi>K</mi><mi>B</mi><mi>A</mi><mo>&#x0003D;</mo><mo>&#x02220;</mo><mi>A</mi><mi>C</mi><mi>L</mi></mrow></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02220;</mo><mi>L</mi><mi>B</mi><mi>K</mi><mo>&#x0003D;</mo><mo>&#x02220;</mo><mi>L</mi><mi>N</mi><mi>C</mi></mrow></math>, <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mo>&#x02220;</mo><mi>L</mi><mi>C</mi><mi>K</mi><mo>&#x0003D;</mo><mo>&#x02220;</mo><mi>B</mi><mi>M</mi><mi>K</mi></mrow></math>. 设<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>O</mi></mrow></math>是三角形<math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>A</mi><mi>K</mi><mi>L</mi></mrow></math>的外心, 求证: <math xmlns="http://www.w3.org/1998/Math/MathML" display="inline"><mrow><mi>O</mi><mi>M</mi><mo>&#x0003D;</mo><mi>O</mi><mi>N</mi></mrow></math>.</p>
